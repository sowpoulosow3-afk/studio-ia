<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio IA</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#1f1b16;--mut:#7a7168;--ac:#c2410c;--bd:#e6ded3}
@media(prefers-color-scheme:dark){:root{--bg:#171412;--card:#221e1b;--tx:#f3ede6;--mut:#a39a90;--ac:#fb923c;--bd:#38322d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}h1{font-size:22px;margin:4px 0 12px}
nav{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:15px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
section{display:none;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
section.on{display:block}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
textarea,select,input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:90px}
.go{width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:16px;font-weight:600}
.go:disabled{opacity:.5}
.res{margin-top:12px}.res img,.res video{width:100%;border-radius:12px}.res audio{width:100%}
.err{color:#dc2626;font-size:14px;margin-top:8px}
</style></head><body><main>
<h1>Studio IA</h1>
<label>Mot de passe</label><input type="password" id="pw" placeholder="Ton mot de passe">
<nav id="tabs" style="margin-top:12px">
<button data-t="img" class="on">Image</button><button data-t="vid">Vidéo</button><button data-t="voix">Voix</button><button data-t="son">Sons</button></nav>

<section id="img" class="on">
<label>Décris ton image</label><textarea id="p-img"></textarea>
<label>Format</label>
<select id="size"><option value="portrait_16_9">Vertical 9:16</option><option value="landscape_16_9">Horizontal 16:9</option><option value="square_hd">Carré</option></select>
<button class="go" data-run="img">Générer l'image</button><div class="res" id="r-img"></div>
</section>

<section id="vid">
<label>Ton image de départ</label><input type="file" id="file" accept="image/*">
<label>Mouvement voulu</label><textarea id="p-vid" placeholder="Elle se retourne et sourit, cheveux au vent"></textarea>
<button class="go" data-run="vid">Générer la vidéo</button><div class="res" id="r-vid"></div>
<p style="font-size:13px;color:var(--mut)">Compte 1 à 3 minutes.</p>
</section>

<section id="voix">
<label>Texte à faire lire</label><textarea id="p-voix"></textarea>
<button class="go" data-run="voix">Générer la voix</button><div class="res" id="r-voix"></div>
</section>

<section id="son">
<label>Décris le son</label><textarea id="p-son" placeholder="Pas de talons sur du marbre, écho léger"></textarea>
<label>Durée (secondes)</label><input type="number" id="sec" value="5" min="1" max="22">
<button class="go" data-run="son">Générer le son</button><div class="res" id="r-son"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('#tabs button,section').forEach(e=>e.classList.remove('on'));
 b.classList.add('on');$(b.dataset.t).classList.add('on');});
$('pw').value=localStorage.getItem('pw')||'';
$('pw').oninput=()=>localStorage.setItem('pw',$('pw').value);

const toData=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
async function call(path,body,blob){
 const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json','x-password':$('pw').value},body:JSON.stringify(body)});
 if(!r.ok){let m='Erreur';try{m=(await r.json()).error}catch{}throw new Error(m)}
 return blob?URL.createObjectURL(await r.blob()):(await r.json()).url;
}
const jobs={
 img:async()=>({tag:'img',src:await call('image',{prompt:$('p-img').value,size:$('size').value})}),
 vid:async()=>{const f=$('file').files[0];if(!f)throw new Error("Choisis une image");
  return{tag:'video',src:await call('video',{prompt:$('p-vid').value,image:await toData(f)})}},
 voix:async()=>({tag:'audio',src:await call('voice',{text:$('p-voix').value},true)}),
 son:async()=>({tag:'audio',src:await call('sound',{text:$('p-son').value,seconds:$('sec').value},true)})
};
document.querySelectorAll('[data-run]').forEach(b=>b.onclick=async()=>{
 const k=b.dataset.run,out=$('r-'+k),old=b.textContent;
 b.disabled=true;b.textContent='Génération en cours…';out.innerHTML='';
 try{const{tag,src}=await jobs[k]();
  const e=document.createElement(tag);e.src=src;if(tag!=='img')e.controls=true;
  const a=document.createElement('a');a.href=src;a.download='studio-ia';a.textContent='Télécharger';a.style.cssText='display:block;margin-top:8px;color:var(--ac)';
  out.append(e,a);
 }catch(e){out.innerHTML='<div class="err"></div>';out.firstChild.textContent=e.message}
 b.disabled=false;b.textContent=old;});
</script></body></html>
